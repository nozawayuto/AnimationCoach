<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Animation Coach">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Animation Coach</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0b0d11; --panel:#151821; --panel2:#1d2230;
      --text:#f6f7fb; --muted:#9ba4b7; --accent:#ff4fa3;
      --border:#303747; --danger:#ff6b6b;
      --safe-t:env(safe-area-inset-top,0px);
      --safe-r:env(safe-area-inset-right,0px);
      --safe-b:env(safe-area-inset-bottom,0px);
      --safe-l:env(safe-area-inset-left,0px);
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-tap-highlight-color:transparent;
      overscroll-behavior:none;
    }
    button,input,select,textarea { font:inherit; }
    button { touch-action:manipulation; }
    .app { max-width:980px; margin:auto; padding:10px 10px calc(18px + var(--safe-b)); }
    .topbar { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
    .title { font-weight:800; letter-spacing:.02em; flex:1; }
    .badge { color:var(--muted); font-size:12px; }
    .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:10px; }
    .tab {
      min-height:44px; border-radius:12px; border:1px solid var(--border);
      background:var(--panel); color:var(--text); font-weight:750;
    }
    .tab.active { background:var(--accent); border-color:transparent; color:white; }
    .panel { display:none; }
    .panel.active { display:block; }
    .landscape-layout { display:block; }
    .video-column,.editor-column { min-width:0; }
    .stage {
      position:relative; background:#000; border:1px solid var(--border);
      border-radius:16px; overflow:hidden; aspect-ratio:16/9;
      display:flex; align-items:center; justify-content:center;
      touch-action:none;
    }
    video, #drawCanvas {
      position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    }
    video { background:#000; }
    #drawCanvas { z-index:2; }
    .empty {
      position:absolute; inset:0; z-index:3; display:grid; place-items:center;
      text-align:center; color:var(--muted); padding:28px; pointer-events:none;
    }
    .empty strong { color:var(--text); display:block; margin-bottom:8px; }
    .hidden { display:none !important; }
    .hud {
      position:absolute; z-index:4; top:10px; left:10px; right:10px;
      display:flex; justify-content:space-between; pointer-events:none;
      text-shadow:0 1px 4px #000;
    }
    .hud span { background:#0009; border-radius:8px; padding:6px 8px; font-variant-numeric:tabular-nums; }
    .scrub { width:100%; accent-color:var(--accent); margin:12px 0 4px; }
    .transport { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin:8px 0; }
    .btn {
      min-height:50px; border-radius:13px; border:1px solid var(--border);
      background:var(--panel); color:var(--text); font-weight:750;
    }
    .btn:active { transform:scale(.98); background:var(--panel2); }
    .btn.primary { background:var(--accent); color:white; border-color:transparent; }
    .btn.danger { color:var(--danger); }
    .btn.small { min-height:43px; font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:9px; }
    .field { background:var(--panel); border:1px solid var(--border); border-radius:13px; padding:9px; }
    .field label { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
    .field input,.field select {
      width:100%; min-height:34px; background:transparent; color:var(--text);
      border:0; outline:0; font-weight:700;
    }
    .row { display:flex; gap:7px; margin-top:9px; }
    .row > * { flex:1; }
    .toolbar {
      display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:7px;
      margin:9px 0;
    }
    .tool.active { outline:2px solid var(--accent); background:var(--panel2); }
    .color-row { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin:9px 0; }
    .swatch {
      width:36px; height:36px; border-radius:50%; border:2px solid var(--border);
      padding:0;
    }
    .swatch.active { outline:3px solid white; }
    .range-wrap { flex:1; min-width:160px; }
    .range-wrap input { width:100%; accent-color:var(--accent); }
    .note-area {
      width:100%; min-height:150px; resize:vertical; border-radius:13px;
      border:1px solid var(--border); background:var(--panel); color:var(--text);
      padding:12px;
    }
    .section-title { margin:4px 0 8px; font-size:15px; font-weight:750; }
    .note-list { display:grid; gap:8px; margin-top:10px; }
    .note-item {
      border:1px solid var(--border); background:var(--panel); border-radius:12px;
      padding:10px; display:grid; grid-template-columns:auto 1fr auto; gap:9px; align-items:start;
    }
    .frame-chip {
      border:0; background:var(--accent); color:white; border-radius:9px;
      padding:7px 9px; font-weight:800;
    }
    .note-text { white-space:pre-wrap; overflow-wrap:anywhere; }
    .icon-btn {
      border:1px solid var(--border); background:transparent; color:var(--danger);
      border-radius:9px; min-width:36px; min-height:36px;
    }
    .status { min-height:22px; color:var(--muted); font-size:13px; margin-top:8px; }
    .help {
      color:var(--muted); font-size:13px; line-height:1.5;
      border-top:1px solid var(--border); padding-top:12px; margin-top:12px;
    }
    .export-box {
      border:1px solid var(--border); background:var(--panel); border-radius:14px;
      padding:12px; margin-top:10px;
    }
    .progress { width:100%; accent-color:var(--accent); }
    input[type=file] { display:none; }
    @media (max-width:680px) {
      .toolbar { grid-template-columns:repeat(3,1fr); }
      .grid { grid-template-columns:repeat(2,1fr); }
      .btn { font-size:13px; padding:4px; }
    }
    @media (orientation:landscape) and (max-height:600px) {
      html,body { height:100%; }
      body { overflow:hidden; }
      .app {
        width:100%; max-width:none; height:100dvh; margin:0;
        padding:max(4px,var(--safe-t)) max(7px,var(--safe-r))
                max(4px,var(--safe-b)) max(7px,var(--safe-l));
        display:grid; grid-template-rows:auto minmax(0,1fr);
      }
      .topbar { display:none; }
      .tabs { min-height:0; gap:5px; margin:0 0 5px; }
      .tab { min-height:34px; border-radius:9px; font-size:12px; }
      .panel.active { min-height:0; overflow-y:auto; }
      #videoPanel.active { height:100%; overflow:hidden; }
      .landscape-layout {
        height:100%; display:grid;
        grid-template-columns:minmax(0,1fr) minmax(0,1fr);
        gap:8px;
      }
      .video-column {
        min-height:0; display:grid;
        grid-template-rows:minmax(0,1fr) auto;
        gap:3px;
      }
      .video-column .stage {
        width:100%; height:100%; min-height:0;
        aspect-ratio:auto; border-radius:11px;
      }
      .video-column .scrub { height:26px; margin:0; }
      .editor-column {
        min-height:0; overflow-y:auto; overscroll-behavior:contain;
        -webkit-overflow-scrolling:touch;
        padding:0 3px calc(8px + var(--safe-b)) 0;
      }
      .editor-column .transport { gap:5px; margin:0 0 6px; }
      .editor-column .btn {
        min-height:38px; border-radius:10px;
        padding:3px; font-size:12px;
      }
      .editor-column .btn.small { min-height:36px; font-size:12px; }
      .editor-column .grid {
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:5px; margin-top:5px;
      }
      .editor-column .field { border-radius:10px; padding:6px; }
      .editor-column .field label { font-size:10px; margin-bottom:2px; }
      .editor-column .field input,
      .editor-column .field select { min-height:27px; font-size:12px; }
      .editor-column .row { gap:5px; margin-top:5px; }
      .editor-column .clip-row {
        display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
      }
      .editor-column .toolbar {
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:5px; margin:5px 0;
      }
      .editor-column .section-title { margin:7px 0 4px; font-size:12px; }
      .editor-column .color-row { gap:6px; margin:5px 0; }
      .editor-column .swatch { width:30px; height:30px; }
      .editor-column .range-wrap { min-width:120px; font-size:11px; }
      .editor-column .history-row {
        display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
      }
      .editor-column .status { min-height:17px; margin-top:4px; font-size:11px; }
      .hud { top:6px; left:6px; right:6px; }
      .hud span { padding:4px 6px; font-size:11px; }
      .empty { padding:15px; font-size:12px; }
    }
  </style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="title">Animation Coach</div>
    <div class="badge">v0.3</div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="videoPanel">🎥 動画</button>
    <button class="tab" data-tab="memoPanel">📝 メモ</button>
    <button class="tab" data-tab="exportPanel">💾 保存</button>
  </div>

  <section class="panel active" id="videoPanel">
    <div class="landscape-layout">
      <div class="video-column">
        <div class="stage" id="stage">
          <video id="video" playsinline preload="metadata"></video>
          <canvas id="drawCanvas"></canvas>
          <div class="empty" id="empty">
            <div><strong>動画を読み込む</strong>「動画を選ぶ」から写真・ファイル内の動画を選択</div>
          </div>
          <div class="hud">
            <span id="frameHud">F 0</span>
            <span id="timeHud">00:00.000</span>
          </div>
        </div>

        <input id="scrub" class="scrub" type="range" min="0" max="1000" value="0" step="1">
      </div>

      <div class="editor-column" aria-label="動画編集コントロール">
        <div class="transport">
          <button class="btn" id="back5">−5F</button>
          <button class="btn" id="back1">−1F</button>
          <button class="btn primary" id="play">▶︎</button>
          <button class="btn" id="next1">+1F</button>
          <button class="btn" id="next5">+5F</button>
        </div>

        <div class="grid">
          <div class="field"><label for="fps">FPS</label><input id="fps" type="number" min="1" max="240" step="0.001" value="30"></div>
          <div class="field"><label for="speed">再生速度</label>
            <select id="speed">
              <option value="0.1">0.1×</option><option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
              <option value="1" selected>1.0×</option><option value="1.5">1.5×</option><option value="2">2.0×</option>
            </select>
          </div>
          <div class="field"><label for="gotoFrame">フレーム移動</label><input id="gotoFrame" type="number" min="0" value="0" inputmode="numeric"></div>
          <button class="btn small" id="go">移動</button>
        </div>

        <div class="row clip-row">
          <label class="btn small" for="file" style="display:grid;place-items:center;">動画を選ぶ</label>
          <input id="file" type="file" accept="video/*">
          <button class="btn small" id="setA">A点</button>
          <button class="btn small" id="setB">B点</button>
          <button class="btn small" id="loop">ABループ OFF</button>
        </div>

        <div class="section-title" style="margin-top:12px;">書き込み</div>
        <div class="toolbar">
          <button class="btn small tool active" data-tool="pen">✏️ ペン</button>
          <button class="btn small tool" data-tool="line">／ 直線</button>
          <button class="btn small tool" data-tool="arrow">➜ 矢印</button>
          <button class="btn small tool" data-tool="circle">◯ 円</button>
          <button class="btn small tool" data-tool="eraser">消しゴム</button>
          <button class="btn small" id="clearDrawing">全消去</button>
        </div>

        <div class="color-row">
          <button class="swatch active" data-color="#ff3b30" style="background:#ff3b30" aria-label="赤"></button>
          <button class="swatch" data-color="#0a84ff" style="background:#0a84ff" aria-label="青"></button>
          <button class="swatch" data-color="#30d158" style="background:#30d158" aria-label="緑"></button>
          <button class="swatch" data-color="#ffd60a" style="background:#ffd60a" aria-label="黄"></button>
          <button class="swatch" data-color="#ffffff" style="background:#ffffff" aria-label="白"></button>
          <div class="range-wrap">
            <label for="brushSize">太さ <span id="brushValue">6</span>px</label>
            <input id="brushSize" type="range" min="2" max="30" value="6">
          </div>
        </div>

        <div class="row history-row">
          <button class="btn small" id="undo">↶ Undo</button>
          <button class="btn small" id="redo">↷ Redo</button>
          <button class="btn small" id="saveFrameImage">書き込み付き画像保存</button>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="memoPanel">
    <div class="section-title">現在フレームのメモ</div>
    <div class="field" style="margin-bottom:9px;">
      <label>リンク先</label>
      <div id="memoFrameLabel" style="font-weight:800;">0F</div>
    </div>
    <textarea id="memoInput" class="note-area" placeholder="例：右足の接地を2F早める／腰を先行させる"></textarea>
    <div class="row">
      <button class="btn primary small" id="saveMemo">このフレームに保存</button>
      <button class="btn small" id="newGeneralMemo">全体メモとして保存</button>
    </div>

    <div class="section-title" style="margin-top:16px;">メモ一覧</div>
    <div class="field"><label for="memoSearch">検索</label><input id="memoSearch" type="search" placeholder="足、腰、タイミング…"></div>
    <div id="noteList" class="note-list"></div>
  </section>

  <section class="panel" id="exportPanel">
    <div class="section-title">書き込み付き動画を書き出す</div>
    <div class="export-box">
      <p style="margin-top:0;color:var(--muted);">
        動画と各フレームの書き込みを合成して保存します。端末によってMP4またはWebMになります。
      </p>
      <div class="grid">
        <div class="field"><label for="exportFps">書き出しFPS</label><input id="exportFps" type="number" min="1" max="60" value="30"></div>
        <div class="field"><label for="exportScale">解像度</label>
          <select id="exportScale"><option value="1">元サイズ</option><option value="0.75">75%</option><option value="0.5">50%</option></select>
        </div>
      </div>
      <button class="btn primary" id="exportVideo" style="width:100%;margin-top:10px;">動画を書き出す</button>
      <progress id="exportProgress" class="progress hidden" max="1" value="0"></progress>
      <div id="exportStatus" class="status" aria-live="polite"></div>
    </div>

    <div class="section-title" style="margin-top:16px;">プロジェクト</div>
    <div class="row">
      <button class="btn small" id="downloadProject">メモ・書き込みを保存</button>
      <label class="btn small" for="importProject" style="display:grid;place-items:center;">プロジェクト読込</label>
      <input id="importProject" type="file" accept="application/json,.json">
    </div>

    <div class="help">
      動画ファイル自体はプロジェクトJSONに含まれません。再開時は同じ動画を選択してからJSONを読み込んでください。
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), canvas = $('drawCanvas'), ctx = canvas.getContext('2d');
  const file = $('file'), scrub = $('scrub'), fpsInput = $('fps');
  const status = $('status'), empty = $('empty');

  let objectUrl = null, A = null, B = null, loopOn = false;
  let tool = 'pen', color = '#ff3b30', brushSize = 6;
  let drawing = false, startPoint = null, tempSnapshot = null;
  let annotations = {}; // frame -> dataURL
  let history = {};     // frame -> [dataURL]
  let historyIndex = {}; // frame -> index
  let memos = [];       // {id, frame|null, text, createdAt}
  let currentLoadedFrame = -1;
  let projectName = 'animation-project';

  const fps = () => Math.max(1, Number(fpsInput.value) || 30);
  const frame = () => Math.max(0, Math.round(video.currentTime * fps()));
  const frameTime = f => Math.max(0, f / fps());

  function fmtTime(s) {
    if (!Number.isFinite(s)) return '00:00.000';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60), ms = Math.floor((s % 1) * 1000);
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(ms).padStart(3,'0')}`;
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    loadAnnotation(frame());
  }

  function clearCanvasOnly() {
    ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  }

  function loadAnnotation(f) {
    currentLoadedFrame = f;
    clearCanvasOnly();
    const data = annotations[f];
    if (!data) return;
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.clientWidth, canvas.clientHeight);
    img.src = data;
  }

  function canvasData() {
    return canvas.toDataURL('image/png');
  }

  function saveAnnotationState(pushHistory = true) {
    const f = frame();
    const data = canvasData();
    annotations[f] = data;
    if (pushHistory) {
      history[f] ||= [];
      const idx = historyIndex[f] ?? -1;
      history[f] = history[f].slice(0, idx + 1);
      history[f].push(data);
      historyIndex[f] = history[f].length - 1;
    }
  }

  function deleteAnnotation(f = frame()) {
    delete annotations[f];
    history[f] = [];
    historyIndex[f] = -1;
    clearCanvasOnly();
  }

  function update() {
    const f = frame();
    $('frameHud').textContent = `F ${f}`;
    $('timeHud').textContent = fmtTime(video.currentTime);
    $('gotoFrame').value = f;
    $('memoFrameLabel').textContent = `${f}F`;
    if (Number.isFinite(video.duration) && video.duration > 0) {
      scrub.value = Math.round((video.currentTime / video.duration) * 1000);
    }
    if (f !== currentLoadedFrame) loadAnnotation(f);
    const aText = A == null ? '未設定' : `${Math.round(A * fps())}F`;
    const bText = B == null ? '未設定' : `${Math.round(B * fps())}F`;
    status.textContent = `A: ${aText} / B: ${bText}`;
  }

  function seekFrames(delta) {
    video.pause();
    const target = Math.max(0, frame() + delta);
    video.currentTime = Math.min(video.duration || Infinity, frameTime(target));
    update();
  }

  function pointFromEvent(e) {
    const r = canvas.getBoundingClientRect();
    const p = e.touches?.[0] || e.changedTouches?.[0] || e;
    return { x:p.clientX-r.left, y:p.clientY-r.top };
  }

  function setupStroke() {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = tool === 'eraser' ? 'rgba(0,0,0,1)' : color;
    ctx.lineWidth = brushSize;
    ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
  }

  function beginDraw(e) {
    if (!video.src) return;
    e.preventDefault();
    drawing = true;
    startPoint = pointFromEvent(e);
    tempSnapshot = ctx.getImageData(0,0,canvas.width,canvas.height);
    setupStroke();
    if (tool === 'pen' || tool === 'eraser') {
      ctx.beginPath(); ctx.moveTo(startPoint.x, startPoint.y);
    }
  }

  function drawArrow(x1,y1,x2,y2) {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const angle = Math.atan2(y2-y1,x2-x1), head = Math.max(12,brushSize*3);
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-head*Math.cos(angle-Math.PI/6), y2-head*Math.sin(angle-Math.PI/6));
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-head*Math.cos(angle+Math.PI/6), y2-head*Math.sin(angle+Math.PI/6));
    ctx.stroke();
  }

  function moveDraw(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = pointFromEvent(e);
    setupStroke();
    if (tool === 'pen' || tool === 'eraser') {
      ctx.lineTo(p.x,p.y); ctx.stroke();
    } else {
      ctx.putImageData(tempSnapshot,0,0);
      setupStroke();
      if (tool === 'line') {
        ctx.beginPath(); ctx.moveTo(startPoint.x,startPoint.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      } else if (tool === 'arrow') {
        drawArrow(startPoint.x,startPoint.y,p.x,p.y);
      } else if (tool === 'circle') {
        const rx=(p.x-startPoint.x)/2, ry=(p.y-startPoint.y)/2;
        ctx.beginPath();
        ctx.ellipse(startPoint.x+rx,startPoint.y+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);
        ctx.stroke();
      }
    }
  }

  function endDraw(e) {
    if (!drawing) return;
    e.preventDefault();
    drawing = false;
    ctx.globalCompositeOperation = 'source-over';
    saveAnnotationState(true);
  }

  canvas.addEventListener('pointerdown', beginDraw);
  canvas.addEventListener('pointermove', moveDraw);
  canvas.addEventListener('pointerup', endDraw);
  canvas.addEventListener('pointercancel', endDraw);

  document.querySelectorAll('.tool').forEach(btn => btn.addEventListener('click', () => {
    tool = btn.dataset.tool;
    document.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b === btn));
  }));
  document.querySelectorAll('.swatch').forEach(btn => btn.addEventListener('click', () => {
    color = btn.dataset.color;
    document.querySelectorAll('.swatch').forEach(b => b.classList.toggle('active', b === btn));
  }));

  $('brushSize').addEventListener('input', e => {
    brushSize = Number(e.target.value);
    $('brushValue').textContent = brushSize;
  });

  $('clearDrawing').addEventListener('click', () => {
    if (!annotations[frame()] && !canvasData()) return;
    deleteAnnotation();
    status.textContent = `${frame()}F の書き込みを消去しました`;
  });

  $('undo').addEventListener('click', () => {
    const f = frame(), arr = history[f] || [];
    if (!arr.length) return;
    historyIndex[f] = Math.max(-1, (historyIndex[f] ?? arr.length-1) - 1);
    if (historyIndex[f] < 0) {
      delete annotations[f]; clearCanvasOnly();
    } else {
      annotations[f] = arr[historyIndex[f]];
      loadAnnotation(f);
    }
  });

  $('redo').addEventListener('click', () => {
    const f = frame(), arr = history[f] || [];
    if (!arr.length) return;
    historyIndex[f] = Math.min(arr.length - 1, (historyIndex[f] ?? -1) + 1);
    annotations[f] = arr[historyIndex[f]];
    loadAnnotation(f);
  });

  $('back1').addEventListener('click', () => seekFrames(-1));
  $('next1').addEventListener('click', () => seekFrames(1));
  $('back5').addEventListener('click', () => seekFrames(-5));
  $('next5').addEventListener('click', () => seekFrames(5));

  $('play').addEventListener('click', async () => {
    if (!video.src) return status.textContent = '先に動画を選んでください';
    if (video.paused) { try { await video.play(); } catch {} } else video.pause();
  });
  video.addEventListener('play', () => $('play').textContent='❚❚');
  video.addEventListener('pause', () => $('play').textContent='▶︎');
  video.addEventListener('timeupdate', () => {
    if (loopOn && A!=null && B!=null && video.currentTime>=B) video.currentTime=A;
    update();
  });
  video.addEventListener('seeked', update);
  video.addEventListener('loadedmetadata', () => {
    empty.classList.add('hidden');
    resizeCanvas();
    update();
  });

  file.addEventListener('change', () => {
    const selected=file.files[0]; if(!selected)return;
    if(objectUrl)URL.revokeObjectURL(objectUrl);
    objectUrl=URL.createObjectURL(selected); video.src=objectUrl;
    projectName=selected.name.replace(/\.[^.]+$/,'') || 'animation-project';
    A=B=null; loopOn=false; $('loop').textContent='ABループ OFF';
    status.textContent=`${selected.name} を読み込みました`;
  });

  scrub.addEventListener('input', () => {
    if(!Number.isFinite(video.duration))return;
    video.pause(); video.currentTime=(Number(scrub.value)/1000)*video.duration; update();
  });
  $('speed').addEventListener('change', e => video.playbackRate=Number(e.target.value));
  fpsInput.addEventListener('change', () => { currentLoadedFrame=-1; update(); });
  $('go').addEventListener('click', () => {
    video.pause(); const f=Math.max(0,Number($('gotoFrame').value)||0);
    video.currentTime=Math.min(video.duration||Infinity,frameTime(f)); update();
  });
  $('setA').addEventListener('click',()=>{A=video.currentTime;update();});
  $('setB').addEventListener('click',()=>{B=video.currentTime;update();});
  $('loop').addEventListener('click',()=>{
    if(A==null||B==null||B<=A)return status.textContent='A点→B点の順に設定してください';
    loopOn=!loopOn; $('loop').textContent=`ABループ ${loopOn?'ON':'OFF'}`;
  });

  function compositeCurrentFrame(outCanvas, scale=1) {
    const c=outCanvas, cctx=c.getContext('2d');
    c.width=Math.max(1,Math.round(video.videoWidth*scale));
    c.height=Math.max(1,Math.round(video.videoHeight*scale));
    cctx.clearRect(0,0,c.width,c.height);
    cctx.drawImage(video,0,0,c.width,c.height);
    const data=annotations[frame()];
    if(data){
      return new Promise(resolve=>{
        const img=new Image();
        img.onload=()=>{cctx.drawImage(img,0,0,c.width,c.height);resolve();};
        img.onerror=resolve; img.src=data;
      });
    }
    return Promise.resolve();
  }

  $('saveFrameImage').addEventListener('click', async()=>{
    if(!video.videoWidth)return status.textContent='動画を読み込んでください';
    const c=document.createElement('canvas'); await compositeCurrentFrame(c,1);
    c.toBlob(blob=>{
      if(!blob)return;
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=`${projectName}_F${String(frame()).padStart(5,'0')}.png`; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    },'image/png');
  });

  // Tabs
  document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===tab.dataset.tab));
    if(tab.dataset.tab==='memoPanel') renderMemos();
    if(tab.dataset.tab==='videoPanel') requestAnimationFrame(resizeCanvas);
  }));

  function addMemo(frameValue,text){
    if(!text.trim())return;
    memos.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),frame:frameValue,text:text.trim(),createdAt:new Date().toISOString()});
    $('memoInput').value=''; renderMemos();
  }
  $('saveMemo').addEventListener('click',()=>addMemo(frame(),$('memoInput').value));
  $('newGeneralMemo').addEventListener('click',()=>addMemo(null,$('memoInput').value));
  $('memoSearch').addEventListener('input',renderMemos);

  function renderMemos(){
    const q=$('memoSearch').value.trim().toLowerCase();
    const list=$('noteList'); list.innerHTML='';
    const filtered=memos.filter(m=>!q||m.text.toLowerCase().includes(q)||String(m.frame??'全体').includes(q));
    if(!filtered.length){
      list.innerHTML='<div class="status">メモはまだありません</div>'; return;
    }
    filtered.forEach(m=>{
      const item=document.createElement('div'); item.className='note-item';
      const jump=document.createElement('button'); jump.className='frame-chip'; jump.textContent=m.frame==null?'全体':`${m.frame}F`;
      jump.disabled=m.frame==null;
      jump.addEventListener('click',()=>{
        video.pause(); video.currentTime=frameTime(m.frame); update();
        document.querySelector('[data-tab="videoPanel"]').click();
      });
      const text=document.createElement('div'); text.className='note-text'; text.textContent=m.text;
      const del=document.createElement('button'); del.className='icon-btn'; del.textContent='×';
      del.addEventListener('click',()=>{memos=memos.filter(x=>x.id!==m.id);renderMemos();});
      item.append(jump,text,del); list.appendChild(item);
    });
  }

  // Project export/import
  $('downloadProject').addEventListener('click',()=>{
    const payload={version:'0.3',projectName,fps:fps(),annotations,memos,A,B,createdAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`${projectName}.animationcoach.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });

  $('importProject').addEventListener('change',async()=>{
    const f=$('importProject').files[0]; if(!f)return;
    try{
      const data=JSON.parse(await f.text());
      annotations=data.annotations||{}; memos=data.memos||[];
      if(data.fps)fpsInput.value=data.fps;
      A=data.A??null; B=data.B??null; projectName=data.projectName||projectName;
      currentLoadedFrame=-1; update(); renderMemos();
      $('exportStatus').textContent='プロジェクトを読み込みました';
    }catch(e){$('exportStatus').textContent='JSONを読み込めませんでした';}
  });

  // Annotated video export (best-effort browser implementation)
  $('exportVideo').addEventListener('click',async()=>{
    if(!video.src||!video.videoWidth)return $('exportStatus').textContent='先に動画を読み込んでください';
    if(!window.MediaRecorder)return $('exportStatus').textContent='このブラウザは動画書き出しに対応していません';

    const exportFps=Math.max(1,Math.min(60,Number($('exportFps').value)||30));
    const scale=Number($('exportScale').value)||1;
    const out=document.createElement('canvas');
    out.width=Math.round(video.videoWidth*scale); out.height=Math.round(video.videoHeight*scale);
    const outCtx=out.getContext('2d');
    const stream=out.captureStream(exportFps);

    let mime='video/webm;codecs=vp9';
    const candidates=['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    mime=candidates.find(x=>MediaRecorder.isTypeSupported(x))||'';
    const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
    const chunks=[];
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};

    const oldTime=video.currentTime, oldRate=video.playbackRate, wasPaused=video.paused;
    video.pause(); video.currentTime=0; await new Promise(r=>video.addEventListener('seeked',r,{once:true}));

    $('exportProgress').classList.remove('hidden');
    $('exportStatus').textContent='書き出し中…画面を閉じないでください';
    rec.start(250);

    const draw=()=>{
      outCtx.clearRect(0,0,out.width,out.height);
      outCtx.drawImage(video,0,0,out.width,out.height);
      const f=Math.max(0,Math.round(video.currentTime*fps()));
      const data=annotations[f];
      if(data){
        const img=new Image(); img.src=data;
        if(img.complete)outCtx.drawImage(img,0,0,out.width,out.height);
        else img.onload=()=>outCtx.drawImage(img,0,0,out.width,out.height);
      }
      $('exportProgress').value=video.duration?video.currentTime/video.duration:0;
    };

    const timer=setInterval(draw,1000/exportFps);
    video.playbackRate=1;
    try{await video.play();}catch(e){
      clearInterval(timer); rec.stop(); $('exportStatus').textContent='再生開始に失敗しました'; return;
    }

    await new Promise(resolve=>video.addEventListener('ended',resolve,{once:true}));
    clearInterval(timer); draw(); rec.stop();
    await new Promise(resolve=>rec.addEventListener('stop',resolve,{once:true}));

    const type=rec.mimeType||mime||'video/webm';
    const ext=type.includes('mp4')?'mp4':'webm';
    const blob=new Blob(chunks,{type});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`${projectName}_annotated.${ext}`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);

    video.currentTime=oldTime; video.playbackRate=oldRate; if(!wasPaused)video.play();
    $('exportProgress').value=1;
    $('exportStatus').textContent=`書き出しました（${ext.toUpperCase()}）`;
  });

  window.addEventListener('resize',resizeCanvas);
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  resizeCanvas(); renderMemos(); update();
})();
</script>
</body>
</html>
